# 성능 측정 전용 DB·Redis. 개발용(infra/docker-compose.local.yml, 5432·6379)과 포트·볼륨·프로젝트 이름이 달라 서로 건드리지 않는다.
#
#   docker compose -f performance-tests/docker-compose.perf.yml up -d
#   docker compose -f performance-tests/docker-compose.perf.yml down -v   # 데이터까지 지움
#
# 운영 서버·운영 DB 에서는 쓰지 않는다. 비밀번호는 이 PC 안에서만 쓰는 측정용 값이다.
name: yeogirok-perf

services:
  db:
    image: postgis/postgis:16-3.4   # 서버 compose 와 같은 이미지
    environment:
      POSTGRES_DB: yeogirok_perf
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf
      TZ: Asia/Seoul
    # 쿼리 통계(pg_stat_statements)와 실행 시간 측정을 켠다. 나머지 설정은 이미지 기본값 그대로 둔다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    ports:
      - "55432:5432"
    volumes:
      - db-perf:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  db-perf:
