# 성능 측정 전용 프로필(performance-tests/README.md). local 과 함께 켠다: SPRING_PROFILES_ACTIVE=local,perf
# 운영(prod)에서는 켜지 않는다. 지표 주소도 로그인 토큰이 있어야 열린다(SecurityConfig 를 바꾸지 않았다).
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
